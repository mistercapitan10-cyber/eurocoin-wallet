name: Apply Database Migrations

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize schema and apply migrations
        run: npm run db:init

      - name: Verify user_id columns (apply if needed)
        run: npx tsx scripts/verify-user-id-migration.ts --apply
